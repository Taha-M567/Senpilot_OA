<!doctype html>
<meta charset="utf-8">
<title>Offline FileMaker matter interaction</title>
<style>.text { min-height: 20px; }</style>
<!-- Reduced from observation-6: layout-object classes persist across sessions;
     generated element IDs and unrelated layout/style markup are omitted. -->
<button>Search</button>
<button>Other Documents - 999</button>
<div class="iwps_body">
  <div>Go Directly to Matter</div>
  <div class="fm-textarea fm_object_254">
    <div class="inner_border">
      <div class="text" tabindex="0" style="min-height: 25px; width: 280px"></div>
      <div class="placeholder">eg M01234</div>
    </div>
  </div>
  <div class="fm_object_258"><button>Search</button></div>
  <button>Search</button>
</div>
<script>
const mode = '__MODE__';
const body = document.querySelector('.iwps_body');
const field = document.querySelector('.fm_object_254 .text');
let committed = '';
field.addEventListener('click', () => {
  if (mode !== 'inactive_editor') {
    setTimeout(() => { field.contentEditable = 'true'; field.focus(); }, 20);
  }
});
field.addEventListener('keydown', event => {
  if (event.key === 'Tab') committed = field.innerText.trim();
});
if (mode === 'missing_field') document.querySelector('.fm_object_254').remove();
if (mode === 'ambiguous_search') {
  document.querySelector('.fm_object_258').append(document.createElement('button'));
  document.querySelector('.fm_object_258 button:last-child').textContent = 'Search';
}
document.querySelector('.fm_object_258 button').addEventListener('click', () => {
  if (mode === 'timeout') return; // Submitted input alone must never prove success.
  if (mode === 'not_found' || committed !== 'M12205') {
    const dialog = document.createElement('div');
    dialog.innerHTML = '<div>No Records Found</div>' +
      '<div>No records matched your search request. Click OK to return to Search page.</div><button>OK</button>';
    document.body.append(dialog);
    return;
  }
  // The detail layout arrives before its data, as on the live site.
  body.innerHTML = '<div><span>Matter No<br>Status</span></div><button>Back to Search Results</button>' +
    '<div class="fm-textarea fm_object_286 v-readonly"><div class="inner_border"><div class="text" tabindex="-1"></div></div></div>' +
    '<div class="iwps_text_box csFM-4BAC3292-04BC-FC44-A278-B61F356EAB45"><div class="text"></div></div>' +
    [289, 287, 298, 292, 294, 295].map(id =>
      `<div class="fm-textarea fm_object_${id} v-readonly"><div class="text"></div></div>`).join('') +
    '<div class="fm_object_276">' +
    ['Recordings', 'Other Documents', 'Exhibits', 'Transcripts', 'Key Documents'].map(name =>
      `<button>${name} - </button>`).join('') + '</div>';
  setTimeout(() => {
    body.querySelector('.fm_object_286 .text').textContent =
      mode === 'mismatch' ? 'M54321\n' : 'M12205\n';
  }, 30);
  // Metadata and counts arrive after the identifier, so search success is insufficient.
  setTimeout(() => {
    const title = body.querySelector('.csFM-4BAC3292-04BC-FC44-A278-B61F356EAB45');
    if (mode !== 'metadata_timeout') title.querySelector('.text').textContent = 'Fixture water project';
    for (const [id, value] of Object.entries({
      289: 'Open', 287: 'Capital Expenditure Approvals', 298: 'Water',
      292: '01/02/2026', 294: '03/04/2026', 295: 'Fixture outcome',
    })) body.querySelector(`.fm_object_${id} .text`).textContent = mode === 'blank_optional' ? '  ' : value;
    if (mode === 'missing_metadata') body.querySelector('.fm_object_292').remove();
    if (mode === 'ambiguous_metadata') body.append(body.querySelector('.fm_object_289').cloneNode(true));
    if (mode === 'missing_title') title.remove();
  }, 100);
  setTimeout(() => {
    const counts = mode.startsWith('collection_') ? collectionCounts() :
      {Exhibits: 2, 'Key Documents': 4, 'Other Documents': 7, Transcripts: 0, Recordings: 0};
    const buttons = body.querySelectorAll('.fm_object_276 button');
    for (const button of buttons) {
      const name = button.textContent.split(' - ')[0];
      button.textContent = `${name} - ${mode === 'all_zero' ? 0 : counts[name]}`;
    }
    const other = [...buttons].find(button => button.textContent.startsWith('Other Documents'));
    if (mode === 'missing_count') other.remove();
    if (mode === 'ambiguous_count') other.parentElement.append(other.cloneNode(true));
    if (mode === 'malformed_count') other.textContent = 'Other Documents - many';
    if (mode === 'negative_count') other.textContent = 'Other Documents - -1';
    if (mode === 'count_timeout') other.textContent = 'Other Documents - ';
    if (mode.startsWith('collection_')) {
      for (const button of buttons) button.addEventListener('click', () => showCollection(button.textContent.split(' - ')[0]));
    } else other.addEventListener('click', showDocuments);
  }, 160);
});

function showDocuments() {
  // Observed Other Documents layout: selected category, list count, grid rows.
  const label = mode === 'wrong_selected_tab' ? 'Exhibits - 2' : 'Other Documents - 7';
  setTimeout(() => {
    body.innerHTML = `<div class="fm-selected"><button>${label}</button></div>` +
      `<div class="iwps_header"><div class="fm_object_213">Found Count: ${mode === 'wrong_list_count' ? 2 : 7}</div></div>` +
      '<button>GO GET IT</button>' + // Unrelated action outside the document grid.
      '<table role="grid"><tbody class="v-grid-body">' +
      [123456, 987654].map((number, index) => `<tr role="row" class="v-grid-row"><td role="gridcell">
        <div class="fm_object_201"><div class="text">${mode === 'missing_document_number' ? '' : number}</div></div>
        <div class="fm_object_202"><div class="text">Fixture ${index ? 'second' : 'first'} document</div></div>
        <div class="fm_object_204"><div class="text">Public</div></div>
        <button onclick="prepareDownload()">GO GET IT</button>
      </td></tr>`).join('') + '</tbody></table>';
    if (mode === 'ambiguous_grid') body.append(body.querySelector('table').cloneNode(true));
  }, 40);
}

function prepareDownload() {
  if (mode === 'missing_dialog') return;
  setTimeout(() => {
    const dialog = document.createElement('div');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-label', 'Download Files');
    const filename = ({html_download: 'html.pdf', empty_download: 'empty.pdf',
      truncated_download: 'truncated.pdf', unknown_download: 'unknown.bin'})[mode] || '123456.pdf';
    dialog.innerHTML = '<div>Download Files</div><div>Your files are ready for download. Please click the button to download each file:</div>' +
      `<div class="fm-download-button" role="button" tabindex="0">${filename}</div><button>Close</button>`;
    dialog.querySelector('.fm-download-button').onclick = () => {
      if (mode === 'download_timeout') return;
      const anchor = document.createElement('a');
      anchor.href = 'https://uarb.novascotia.ca/fixture/' + filename;
      anchor.download = filename;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
    };
    if (mode === 'ambiguous_filename') dialog.append(dialog.querySelector('.fm-download-button').cloneNode(true));
    document.body.append(dialog);
  }, 40);
}

function collectionCounts() {
  const dates = mode.startsWith('collection_dates');
  return {Exhibits: 2, 'Key Documents': 3, 'Other Documents': 25, Transcripts: dates ? 2 : 0, Recordings: dates ? 2 : 0};
}

function showCollection(category) {
  const counts = collectionCounts();
  const count = counts[category];
  setTimeout(() => {
    body.innerHTML = Object.entries(counts).map(([name,n]) =>
      `<div class="${name === category ? 'fm-selected' : ''}"><button onclick="showCollection('${name}')">${name} - ${n}</button></div>`).join('') +
      `<div class="iwps_header">${category === 'Key Documents' ? '' :
        `<div class="fm_object_${category === 'Exhibits' ? 319 : 213}">Found Count: ${count}</div>`}</div>` +
      '<button>GO GET IT</button>' +
      '<div class="v-grid" style="position:relative;height:204px;width:650px">' +
      `<div class="v-grid-scroller-vertical" style="${count<=3 ? 'display:none;' : ''}position:absolute;right:0;height:204px;width:16px;overflow-y:scroll"><div style="height:${count*68}px;width:1px"></div></div>` +
      '<div style="position:relative;overflow:hidden;height:204px;width:630px"><table role="grid"><tbody class="v-grid-body" style="display:block"></tbody></table></div></div>';
    const scroll = body.querySelector('.v-grid-scroller-vertical');
    const tbody = body.querySelector('tbody');
    const render = () => {
      const first = Math.max(0, Math.floor(scroll.scrollTop/68) - 1);
      tbody.style.transform = `translateY(${-scroll.scrollTop}px)`;
      tbody.innerHTML = Array.from({length:Math.min(5,count-first)},(_,i) => {
        const index = first+i;
        const dateCategory = category === 'Transcripts' || category === 'Recordings';
        const number = dateCategory ? `01/0${mode === 'collection_dates_ambiguous' ? 7 : 7+index}/2026` :
          category === 'Exhibits' ? `H-${index+1}` : String((category === 'Key Documents' ? 200001 : 100001)+index);
        const idClass = category === 'Exhibits' ? 300 : category === 'Key Documents' ? 268 : 201;
        const shown = mode === 'collection_ambiguous' && i === 1 ?
          String((category === 'Key Documents' ? 200001 : 100001)+first) : number;
        const security = mode === 'collection_private' && number === '100002' ? 'Confidential' : 'Public';
        return `<tr role="row" class="v-grid-row v-grid-row-has-data" style="position:absolute;display:block;transform:translateY(${index*68}px);height:68px;width:620px"><td role="gridcell" style="display:block">
          <span class="fm_object_${idClass}"><span class="text">${shown}</span></span>
          <span class="fm_object_202"><span class="text">${category === 'Transcripts' ? 'Witness '+index : category === 'Recordings' ? 'Day '+(index+1) : 'Fixture document '+number}</span></span>
          ${category === 'Transcripts' ? '<span class="fm_object_202"><span class="text">Another witness</span></span>' : ''}
          <span class="fm_object_204"><span class="text">${security}</span></span>
          <span class="fm_object_${category === 'Transcripts' ? 291 : category === 'Recordings' ? 292 : 299}"><button onclick="collectionDownload('${number}','${category}')">GO GET IT</button></span></td></tr>`;
      }).join('');
    };
    scroll.addEventListener('scroll', () => {
      if (mode === 'collection_stalled') return;
      setTimeout(render, 20);
    });
    render();
  }, 30);
}

function collectionDownload(number, category) {
  if (mode === 'collection_missing_dialog' && number === '100002') return;
  const dates = category === 'Transcripts' || category === 'Recordings';
  if (dates) {
    const exportDialog = document.createElement('div');
    exportDialog.setAttribute('role','dialog'); exportDialog.setAttribute('aria-label','Export Field to File');
    const exportName = mode === 'collection_dates_comma' ? 'Transcripts,01072026.pdf' : category+'-'+number.replaceAll('/','')+(category === 'Recordings' ? '.MP3' : '.pdf');
    exportDialog.innerHTML = `<input type="text" value="${mode === 'collection_dates_blank_export' ? '' : exportName}"><button>OK</button><button>Cancel</button>`;
    exportDialog.querySelector('button').onclick = () => {
      const filename = exportDialog.querySelector('input').value;
      exportDialog.remove(); ready(filename);
    };
    exportDialog.querySelector('button:last-child').onclick = () => exportDialog.remove();
    document.body.append(exportDialog);
  } else ready();
  function ready(exportName) { setTimeout(() => {
    const dialog = document.createElement('div');
    dialog.setAttribute('role','dialog'); dialog.setAttribute('aria-label','Download Files');
    const filename = exportName || (mode === 'collection_html' && number === '100002' ? 'html.pdf' : `${number}.pdf`);
    dialog.innerHTML = `<div>Download Files</div><div role="button" class="fm-download-button" tabindex="0">${filename}</div><button>Close</button>`;
    dialog.querySelector('.fm-download-button').onclick = () => {
      if (mode === 'collection_download_timeout' && number === '100002') return;
      const anchor = document.createElement('a');
      anchor.href='https://uarb.novascotia.ca/fixture/'+filename;
      anchor.download=filename; document.body.append(anchor); anchor.click(); anchor.remove();
    };
    dialog.querySelector('button').onclick = () => {
      if (mode !== 'collection_close_failure') dialog.remove();
    };
    document.body.append(dialog);
  },30); }
}
</script>
